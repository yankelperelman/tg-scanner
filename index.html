<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер QR-кодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        
        #reader {
            width: 100%;
            max-width: 500px;
            padding: 0;
            margin: 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        #reader video {
            border-radius: 10px;
            width: 100%;
            height: auto;
        }
        
        .status {
            margin-top: 10px;
            padding: 12px;
            background-color: #333;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            width: 90%;
            max-width: 500px;
            transition: all 0.3s;
        }
        
        .scanned-codes {
            margin-top: 10px;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .code-item {
            padding: 8px;
            margin: 5px 0;
            background-color: #3a3a3a;
            border-radius: 5px;
            font-size: 12px;
            word-break: break-all;
            font-family: monospace;
        }
        
        .success {
            background-color: #4CAF50 !important;
        }
        
        .warning {
            background-color: #FF9800 !important;
        }
        
        .error {
            background-color: #f44336 !important;
        }
        
        .info {
            background-color: #2196F3 !important;
        }
    </style>
</head>
<body>
    <div class="header">📱 Сканер штрихкодов</div>
    <div id="reader"></div>
    <div class="status" id="status">📸 Наведите камеру на этикетку</div>
    <div class="scanned-codes" id="scannedCodes">
        <b>Отсканированные коды:</b>
        <div id="codesList"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let html5QrCode = null;
        let isProcessing = false;
        let lastScanTime = 0;
        const SCAN_COOLDOWN = 500;
        let scannedCodes = [];
        let cameraStream = null;

        // Функция для запроса разрешения камеры
        async function requestCameraPermission() {
            try {
                // Пытаемся получить доступ к камере напрямую
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    } 
                });
                
                cameraStream = stream;
                console.log('✅ Разрешение камеры получено');
                return true;
            } catch (error) {
                console.error('❌ Ошибка доступа к камере:', error);
                
                // Показываем понятное сообщение об ошибке
                const status = document.getElementById('status');
                if (error.name === 'NotAllowedError') {
                    status.innerHTML = '❌ Доступ к камере запрещен. Пожалуйста, разрешите доступ к камере в настройках Telegram.';
                } else if (error.name === 'NotFoundError') {
                    status.innerHTML = '❌ Камера не найдена на устройстве.';
                } else if (error.name === 'NotReadableError') {
                    status.innerHTML = '❌ Камера занята другим приложением. Закройте другие приложения и попробуйте снова.';
                } else {
                    status.innerHTML = '❌ Ошибка доступа к камере. Попробуйте перезапустить сканер.';
                }
                status.className = 'status error';
                return false;
            }
        }

        function isLikelyBarcode(text) {
            const clean = text.trim();
            
            if (/^[A-Za-z0-9\-\.\+\/]+$/.test(clean)) {
                if (clean.length >= 10) {
                    return true;
                }
                if (/^\d{8}$/.test(clean) || /^\d{13}$/.test(clean)) {
                    return true;
                }
            }
            return false;
        }

        function extractBarcodes(text) {
            const barcodes = [];
            const parts = text.split(/[\s\n\r,;|]+/);
            
            for (let part of parts) {
                part = part.trim();
                if (part && isLikelyBarcode(part)) {
                    barcodes.push(part);
                }
            }
            
            if (barcodes.length === 0 && isLikelyBarcode(text)) {
                barcodes.push(text.trim());
            }
            
            return barcodes;
        }

        async function onScanSuccess(decodedText, decodedResult) {
            const now = Date.now();
            
            if (isProcessing || (now - lastScanTime < SCAN_COOLDOWN)) {
                return;
            }
            
            isProcessing = true;
            lastScanTime = now;
            
            const barcodes = extractBarcodes(decodedText);
            
            if (barcodes.length === 0) {
                isProcessing = false;
                return;
            }
            
            // Добавляем новые коды
            let newCodes = 0;
            for (let barcode of barcodes) {
                if (!scannedCodes.includes(barcode)) {
                    scannedCodes.push(barcode);
                    newCodes++;
                }
            }
            
            // Показываем отсканированные коды
            if (scannedCodes.length > 0) {
                document.getElementById('scannedCodes').style.display = 'block';
                const codesList = document.getElementById('codesList');
                codesList.innerHTML = '';
                
                for (let code of scannedCodes) {
                    const codeElement = document.createElement('div');
                    codeElement.className = 'code-item';
                    codeElement.textContent = code;
                    codesList.appendChild(codeElement);
                }
            }
            
            const status = document.getElementById('status');
            
            if (scannedCodes.length >= 2) {
                // Нашли оба кода
                status.innerHTML = `✅ <b>Найдено кодов: ${scannedCodes.length}</b>`;
                status.className = 'status success';
                
                const allCodes = scannedCodes.join('|');
                try {
                    tg.sendData(allCodes);
                    
                    setTimeout(() => {
                        tg.close();
                    }, 200);
                    
                } catch (error) {
                    console.error('Ошибка отправки:', error);
                    status.innerHTML = '❌ Ошибка отправки данных';
                    status.className = 'status error';
                    isProcessing = false;
                }
            } else {
                // Нашли только один код
                status.innerHTML = `📸 <b>Найден 1 код.</b> Ищу второй...`;
                status.className = 'status warning';
                
                setTimeout(() => {
                    isProcessing = false;
                }, 100);
            }
        }

        function onScanError(error) {
            // Игнорируем ошибки сканирования
        }

        async function initScanner() {
            try {
                // Сначала запрашиваем разрешение камеры
                const hasPermission = await requestCameraPermission();
                
                if (!hasPermission) {
                    return;
                }
                
                // Останавливаем stream, если он был создан
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                
                // Создаем сканер
                html5QrCode = new Html5Qrcode("reader");
                
                const config = {
                    fps: 30,
                    qrbox: { width: 350, height: 250 },
                    aspectRatio: 1.4,
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.CODE_39,
                        Html5QrcodeSupportedFormats.QR_CODE,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E,
                        Html5QrcodeSupportedFormats.CODABAR,
                        Html5QrcodeSupportedFormats.DATA_MATRIX,
                        Html5QrcodeSupportedFormats.ITF,
                        Html5QrcodeSupportedFormats.AZTEC,
                    ]
                };

                // Запускаем сканер
                await html5QrCode.start(
                    { 
                        facingMode: "environment"
                    },
                    config,
                    onScanSuccess,
                    onScanError
                );

                console.log('✅ Сканер запущен');

            } catch (error) {
                console.error('Ошибка инициализации:', error);
                const status = document.getElementById('status');
                status.innerHTML = '❌ Ошибка инициализации сканера. Попробуйте перезапустить.';
                status.className = 'status error';
            }
        }

        // Обработка закрытия WebApp
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && html5QrCode) {
                try {
                    html5QrCode.stop().then(() => {
                        html5QrCode.clear();
                    });
                } catch (e) {
                    console.error('Error stopping scanner:', e);
                }
            }
        });

        // Запуск сканера при загрузке
        window.addEventListener('load', initScanner);
        
        // Обработка ошибок
        window.addEventListener('error', (e) => {
            console.error('Global error:', e);
        });
        
        // Экспортируем функции для отладки
        window.restartScanner = initScanner;
    </script>
</body>
</html>
