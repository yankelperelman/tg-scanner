<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер QR-кодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #212121;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            padding: 0;
            margin: 0;
        }
        #reader video {
            border-radius: 10px;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background-color: #333;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            width: 90%;
            max-width: 500px;
        }
        .scanned-codes {
            margin-top: 10px;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            display: none;
        }
        .code-item {
            padding: 5px;
            margin: 5px 0;
            background-color: #3a3a3a;
            border-radius: 5px;
            font-size: 12px;
        }
        .success {
            background-color: #4CAF50 !important;
        }
        .warning {
            background-color: #FF9800 !important;
        }
    </style>
</head>
<body>
    <div id="reader"></div>
    <div class="status" id="status">📸 Наведите камеру на штрихкод</div>
    <div class="scanned-codes" id="scannedCodes">
        <b>Отсканированные коды:</b>
        <div id="codesList"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let html5QrCode = null;
        let isProcessing = false;
        let lastScanTime = 0;
        const SCAN_COOLDOWN = 500; // 0.5 секунды между сканированиями
        let scannedCodes = [];
        let cameraStream = null;
        let scanMode = 'auto'; // 'auto' - автоматически определять, 'manual' - ручной режим

        // Проверяем, есть ли сохраненное разрешение
        function checkCameraPermission() {
            if (navigator.permissions && navigator.permissions.query) {
                navigator.permissions.query({ name: 'camera' })
                    .then(permissionStatus => {
                        if (permissionStatus.state === 'granted') {
                            console.log('✅ Разрешение камеры уже предоставлено');
                        } else if (permissionStatus.state === 'denied') {
                            console.log('❌ Доступ к камере запрещен');
                            showCameraError();
                        } else {
                            console.log('⚠️ Нужно запросить разрешение');
                        }
                    })
                    .catch(err => console.log('Не удалось проверить разрешение:', err));
            }
        }

        function showCameraError() {
            document.getElementById('status').innerHTML = 
                '❌ Доступ к камере запрещен. Разрешите доступ в настройках браузера.';
            document.getElementById('status').className = 'status warning';
        }

        function isLikelyBarcode(text) {
            // Проверяем, похож ли текст на штрихкод
            // Честный знак обычно содержит только цифры и имеет длину 13+ символов
            // Обычный штрихкод EAN-13 содержит 13 цифр
            
            // Убираем пробелы
            const clean = text.trim();
            
            // Проверяем на наличие только цифр и букв (для DataMatrix)
            if (/^[A-Za-z0-9\-\.\+\/]+$/.test(clean)) {
                // Если это длинный код (более 10 символов) - вероятно штрихкод
                if (clean.length >= 10) {
                    return true;
                }
                // Если это 8 или 13 цифр - это EAN
                if (/^\d{8}$/.test(clean) || /^\d{13}$/.test(clean)) {
                    return true;
                }
            }
            return false;
        }

        function extractBarcodes(text) {
            // Функция для извлечения штрихкодов из текста
            // Если камера захватила несколько кодов одновременно
            const barcodes = [];
            
            // Разделяем по возможным разделителям
            const parts = text.split(/[\s\n\r,;|]+/);
            
            for (let part of parts) {
                part = part.trim();
                if (part && isLikelyBarcode(part)) {
                    barcodes.push(part);
                }
            }
            
            // Если не нашли разделенных кодов, проверяем весь текст
            if (barcodes.length === 0 && isLikelyBarcode(text)) {
                barcodes.push(text.trim());
            }
            
            return barcodes;
        }

        async function onScanSuccess(decodedText, decodedResult) {
            const now = Date.now();
            
            // Защита от множественных срабатываний
            if (isProcessing || (now - lastScanTime < SCAN_COOLDOWN)) {
                return;
            }
            
            isProcessing = true;
            lastScanTime = now;
            
            // Извлекаем штрихкоды
            const barcodes = extractBarcodes(decodedText);
            
            if (barcodes.length === 0) {
                isProcessing = false;
                return;
            }
            
            // Добавляем новые коды
            let newCodes = 0;
            for (let barcode of barcodes) {
                if (!scannedCodes.includes(barcode)) {
                    scannedCodes.push(barcode);
                    newCodes++;
                }
            }
            
            // Показываем отсканированные коды
            if (scannedCodes.length > 0) {
                document.getElementById('scannedCodes').style.display = 'block';
                const codesList = document.getElementById('codesList');
                codesList.innerHTML = '';
                
                for (let code of scannedCodes) {
                    const codeElement = document.createElement('div');
                    codeElement.className = 'code-item';
                    codeElement.textContent = code;
                    codesList.appendChild(codeElement);
                }
            }
            
            // Обновляем статус
            if (scannedCodes.length >= 2) {
                // Нашли оба кода (артикул и Честный знак)
                document.getElementById('status').innerHTML = 
                    `✅ <b>Найдено кодов: ${scannedCodes.length}</b>`;
                document.getElementById('status').className = 'status success';
                
                // Отправляем все коды в бота
                const allCodes = scannedCodes.join('|');
                try {
                    tg.sendData(allCodes);
                    
                    setTimeout(() => {
                        tg.close();
                    }, 200);
                    
                } catch (error) {
                    console.error('Ошибка отправки:', error);
                    isProcessing = false;
                }
            } else {
                // Нашли только один код
                document.getElementById('status').innerHTML = 
                    `📸 <b>Найден 1 код.</b> Ищу второй...`;
                document.getElementById('status').className = 'status warning';
                
                // Продолжаем сканирование
                setTimeout(() => {
                    isProcessing = false;
                }, 100);
            }
        }

        function onScanError(error) {
            // Игнорируем ошибки сканирования
        }

        async function initScanner() {
            try {
                // Проверяем разрешение камеры
                checkCameraPermission();
                
                html5QrCode = new Html5Qrcode("reader");
                
                const config = {
                    fps: 30,
                    qrbox: { width: 350, height: 250 }, // Увеличиваем область для захвата нескольких кодов
                    aspectRatio: 1.4,
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.CODE_39,
                        Html5QrcodeSupportedFormats.QR_CODE,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E,
                        Html5QrcodeSupportedFormats.CODABAR,
                        Html5QrcodeSupportedFormats.DATA_MATRIX,
                        Html5QrcodeSupportedFormats.ITF,
                        Html5QrcodeSupportedFormats.AZTEC,
                    ]
                };

                // Сохраняем поток камеры для повторного использования
                await html5QrCode.start(
                    { 
                        facingMode: "environment",
                        // Добавляем параметры для сохранения разрешения
                        advanced: [{ 
                            facingMode: "environment",
                            width: { ideal: 1920 },
                            height: { ideal: 1080 }
                        }]
                    },
                    config,
                    onScanSuccess,
                    onScanError
                );

                // Получаем видеопоток для сохранения
                const video = document.querySelector('#reader video');
                if (video) {
                    video.setAttribute('playsinline', 'true');
                    video.setAttribute('autoplay', 'true');
                    
                    // Сохраняем поток
                    if (video.srcObject) {
                        cameraStream = video.srcObject;
                        
                        // Пытаемся сохранить разрешение в localStorage
                        try {
                            localStorage.setItem('cameraPermission', 'granted');
                        } catch (e) {}
                    }
                }

            } catch (error) {
                console.error('Ошибка инициализации:', error);
                showCameraError();
            }
        }

        // Функция для повторного использования камеры
        async function reuseCamera() {
            if (cameraStream) {
                try {
                    // Останавливаем старый сканер
                    if (html5QrCode) {
                        await html5QrCode.stop();
                    }
                    
                    // Переиспользуем поток
                    const video = document.createElement('video');
                    video.srcObject = cameraStream;
                    await video.play();
                    
                    // Пересоздаем сканер с тем же потоком
                    html5QrCode = new Html5Qrcode("reader", video);
                    
                    // Продолжаем сканирование
                    await html5QrCode.start(
                        { facingMode: "environment" },
                        {
                            fps: 30,
                            qrbox: { width: 350, height: 250 },
                            aspectRatio: 1.4,
                        },
                        onScanSuccess,
                        onScanError
                    );
                    
                    console.log('✅ Камера переиспользована');
                    return true;
                } catch (error) {
                    console.error('Ошибка переиспользования камеры:', error);
                    return false;
                }
            }
            return false;
        }

        // Обработка закрытия WebApp
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && html5QrCode) {
                try {
                    html5QrCode.stop().then(() => {
                        html5QrCode.clear();
                    });
                } catch (e) {
                    console.error('Error stopping scanner:', e);
                }
            }
        });

        // Инициализация при загрузке
        window.addEventListener('load', initScanner);
        
        // Обработка ошибок
        window.addEventListener('error', (e) => {
            console.error('Global error:', e);
        });
    </script>
</body>
</html>
