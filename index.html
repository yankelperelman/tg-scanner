<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер QR-кодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            background-color: #212121;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        #reader {
            width: 100%;
            max-width: 400px;
            padding: 10px;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background-color: #8774e1;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        button:hover {
            background-color: #7763d1;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #333;
            border-radius: 8px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <h2>📱 Сканер QR-кодов</h2>
    <div id="reader"></div>
    <button onclick="stopScanner()">Остановить сканер</button>
    <div id="result"></div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let html5QrcodeScanner = null;

        function onScanSuccess(decodedText, decodedResult) {
            console.log(`Код отсканирован: ${decodedText}`);
            document.getElementById('result').innerHTML = `✅ Результат: <b>${decodedText}</b>`;
            document.getElementById('result').style.display = 'block';
            
            // Отправляем результат в бота
            tg.sendData(decodedText);
            tg.close();
        }

        function onScanError(error) {
            // Ignore errors for scanning
        }

        function initScanner() {
            html5QrcodeScanner = new Html5QrcodeScanner(
                "reader",
                {
                    fps: 10,
                    qrbox: { width: 250, height: 250 },
                    videoConstraints: {
                        facingMode: { ideal: "environment" }
                    },
                    experimentalFeatures: {
                        useBarCodeDetectorIfSupported: true
                    }
                },
                /* verbose= */ false
            );
            html5QrcodeScanner.render(onScanSuccess, onScanError);
        }

        function stopScanner() {
            if (html5QrcodeScanner) {
                html5QrcodeScanner.clear();
                tg.close();
            }
        }

        window.onload = function() {
            initScanner();
        };
    </script>
</body>
</html>
