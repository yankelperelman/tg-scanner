<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер штрихкодов и DataMatrix</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Используем ZXing вместо html5-qrcode для лучшей поддержки DataMatrix -->
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            overflow: hidden;
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        
        #videoContainer {
            width: 100%;
            max-width: 500px;
            position: relative;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        
        #video {
            width: 100%;
            height: auto;
            display: block;
        }
        
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            height: 200px;
            border: 2px solid #4CAF50;
            border-radius: 10px;
            pointer-events: none;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(76, 175, 80, 0); }
            100% { box-shadow: 0 0 0 0 rgba(76, 175, 80, 0); }
        }
        
        .status {
            margin-top: 10px;
            padding: 12px;
            background-color: #333;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            width: 90%;
            max-width: 500px;
            transition: all 0.3s;
        }
        
        .scanned-codes {
            margin-top: 10px;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
            display: none;
            animation: slideIn 0.3s ease;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .code-item {
            padding: 8px;
            margin: 5px 0;
            background-color: #3a3a3a;
            border-radius: 5px;
            font-size: 12px;
            word-break: break-all;
            font-family: monospace;
        }
        
        .success {
            background-color: #4CAF50 !important;
        }
        
        .warning {
            background-color: #FF9800 !important;
        }
        
        .error {
            background-color: #f44336 !important;
        }
        
        .info {
            background-color: #2196F3 !important;
        }
        
        .restart-btn {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #8774e1;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            display: none;
        }
        
        .restart-btn:hover {
            background-color: #7763d1;
        }
    </style>
</head>
<body>
    <div class="header">📱 Сканер штрихкодов и DataMatrix</div>
    <div id="videoContainer">
        <video id="video" playsinline></video>
        <div class="scan-overlay"></div>
    </div>
    <div class="status" id="status">📸 Наведите камеру на код</div>
    <div class="scanned-codes" id="scannedCodes">
        <b>Отсканированные коды:</b>
        <div id="codesList"></div>
    </div>
    <button class="restart-btn" id="restartBtn" onclick="restartScanner()">🔄 Перезапустить сканер</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let codeReader = null;
        let isProcessing = false;
        let lastScanTime = 0;
        const SCAN_COOLDOWN = 500;
        let scannedCodes = [];
        let videoElement = null;
        let scanningActive = true;

        // Инициализация ZXing
        async function initScanner() {
            try {
                const status = document.getElementById('status');
                status.innerHTML = '📸 Запуск камеры...';
                status.className = 'status info';
                
                // Создаем reader
                codeReader = new ZXing.BrowserMultiFormatReader();
                
                // Получаем видеопоток
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: "environment",
                        width: { ideal: 1920 },
                        height: { ideal: 1080 }
                    },
                    audio: false
                });
                
                videoElement = document.getElementById('video');
                videoElement.srcObject = stream;
                await videoElement.play();
                
                status.innerHTML = '📸 Наведите камеру на штрихкод или DataMatrix';
                status.className = 'status';
                
                // Настраиваем hints для распознавания
                const hints = new Map();
                hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
                    ZXing.BarcodeFormat.EAN_13,
                    ZXing.BarcodeFormat.EAN_8,
                    ZXing.BarcodeFormat.CODE_128,
                    ZXing.BarcodeFormat.CODE_39,
                    ZXing.BarcodeFormat.QR_CODE,
                    ZXing.BarcodeFormat.DATA_MATRIX,
                    ZXing.BarcodeFormat.UPC_A,
                    ZXing.BarcodeFormat.UPC_E,
                    ZXing.BarcodeFormat.CODABAR,
                    ZXing.BarcodeFormat.ITF,
                    ZXing.BarcodeFormat.AZTEC
                ]);
                hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
                
                // Запускаем сканирование
                await startScanning(hints);
                
            } catch (error) {
                console.error('Ошибка инициализации:', error);
                const status = document.getElementById('status');
                
                if (error.name === 'NotAllowedError') {
                    status.innerHTML = '❌ Доступ к камере запрещен. Разрешите доступ в настройках Telegram.';
                } else if (error.name === 'NotFoundError') {
                    status.innerHTML = '❌ Камера не найдена.';
                } else {
                    status.innerHTML = '❌ Ошибка: ' + error.message;
                }
                status.className = 'status error';
                document.getElementById('restartBtn').style.display = 'block';
            }
        }

        async function startScanning(hints) {
            try {
                await codeReader.decodeFromVideoDevice(
                    undefined, // используем текущую камеру
                    videoElement,
                    (result, err) => {
                        if (result && scanningActive) {
                            handleScanResult(result.text);
                        }
                        // Игнорируем ошибки
                    }
                );
            } catch (error) {
                console.error('Ошибка сканирования:', error);
            }
        }

        function isLikelyBarcode(text) {
            const clean = text.trim();
            
            // Расширенная проверка для различных типов кодов
            if (/^[A-Za-z0-9\-\.\+\/]+$/.test(clean)) {
                // DataMatrix обычно содержит только заглавные буквы, цифры и спецсимволы
                if (clean.length >= 10) {
                    return true;
                }
                // EAN-8 и EAN-13
                if (/^\d{8}$/.test(clean) || /^\d{13}$/.test(clean)) {
                    return true;
                }
            }
            return false;
        }

        function extractBarcodes(text) {
            const barcodes = [];
            const parts = text.split(/[\s\n\r,;|]+/);
            
            for (let part of parts) {
                part = part.trim();
                if (part && isLikelyBarcode(part)) {
                    barcodes.push(part);
                }
            }
            
            if (barcodes.length === 0 && isLikelyBarcode(text)) {
                barcodes.push(text.trim());
            }
            
            return barcodes;
        }

        function handleScanResult(decodedText) {
            const now = Date.now();
            
            if (isProcessing || (now - lastScanTime < SCAN_COOLDOWN)) {
                return;
            }
            
            isProcessing = true;
            lastScanTime = now;
            
            const barcodes = extractBarcodes(decodedText);
            
            if (barcodes.length === 0) {
                isProcessing = false;
                return;
            }
            
            // Добавляем новые коды
            let newCodes = 0;
            for (let barcode of barcodes) {
                if (!scannedCodes.includes(barcode)) {
                    scannedCodes.push(barcode);
                    newCodes++;
                }
            }
            
            // Показываем отсканированные коды
            if (scannedCodes.length > 0) {
                document.getElementById('scannedCodes').style.display = 'block';
                const codesList = document.getElementById('codesList');
                codesList.innerHTML = '';
                
                for (let code of scannedCodes) {
                    const codeElement = document.createElement('div');
                    codeElement.className = 'code-item';
                    codeElement.textContent = code;
                    codesList.appendChild(codeElement);
                }
            }
            
            const status = document.getElementById('status');
            
            if (scannedCodes.length >= 2) {
                // Нашли оба кода
                scanningActive = false;
                status.innerHTML = `✅ <b>Найдено кодов: ${scannedCodes.length}</b>`;
                status.className = 'status success';
                
                const allCodes = scannedCodes.join('|');
                try {
                    tg.sendData(allCodes);
                    
                    setTimeout(() => {
                        tg.close();
                    }, 300);
                    
                } catch (error) {
                    console.error('Ошибка отправки:', error);
                    status.innerHTML = '❌ Ошибка отправки данных';
                    status.className = 'status error';
                    isProcessing = false;
                    scanningActive = true;
                }
            } else {
                // Нашли только один код
                status.innerHTML = `📸 <b>Найден 1 код.</b> Ищу второй...`;
                status.className = 'status warning';
                
                // Воспроизводим звуковой сигнал
                beep();
                
                setTimeout(() => {
                    isProcessing = false;
                }, 200);
            }
        }

        function beep() {
            // Создаем короткий звуковой сигнал
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 1000;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                console.log('Звук недоступен');
            }
        }

        function restartScanner() {
            scanningActive = true;
            scannedCodes = [];
            isProcessing = false;
            
            document.getElementById('scannedCodes').style.display = 'none';
            document.getElementById('restartBtn').style.display = 'none';
            
            const status = document.getElementById('status');
            status.innerHTML = '📸 Наведите камеру на код';
            status.className = 'status';
            
            initScanner();
        }

        // Остановка сканера при закрытии
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                scanningActive = false;
                if (codeReader) {
                    try {
                        codeReader.reset();
                    } catch (e) {
                        console.error('Error stopping scanner:', e);
                    }
                }
                if (videoElement && videoElement.srcObject) {
                    videoElement.srcObject.getTracks().forEach(track => track.stop());
                }
            }
        });

        // Запуск при загрузке
        window.addEventListener('load', initScanner);
        
        // Обработка ошибок
        window.addEventListener('error', (e) => {
            console.error('Global error:', e);
        });
    </script>
</body>
</html>
