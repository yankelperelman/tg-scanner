<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сканер QR-кодов</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #212121;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #reader {
            width: 100%;
            max-width: 500px;
            padding: 0;
            margin: 0;
        }
        #reader video {
            border-radius: 10px;
        }
        .status {
            margin-top: 10px;
            padding: 10px;
            background-color: #333;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
        }
        .scanned-codes {
            margin-top: 10px;
            padding: 10px;
            background-color: #2a2a2a;
            border-radius: 8px;
            width: 90%;
            max-width: 500px;
            display: none;
        }
        .code-item {
            padding: 5px;
            margin: 5px 0;
            background-color: #3a3a3a;
            border-radius: 5px;
            font-size: 12px;
        }
        .success {
            background-color: #4CAF50 !important;
        }
        .warning {
            background-color: #FF9800 !important;
        }
    </style>
</head>
<body>
    <div id="reader"></div>
    <div class="status" id="status">📸 Наведите камеру на штрихкод</div>
    <div class="scanned-codes" id="scannedCodes">
        <b>Отсканированные коды:</b>
        <div id="codesList"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let html5QrCode = null;
        let isProcessing = false;
        let lastScanTime = 0;
        const SCAN_COOLDOWN = 500;
        let scannedCodes = [];

        function isLikelyBarcode(text) {
            const clean = text.trim();
            
            if (/^[A-Za-z0-9\-\.\+\/]+$/.test(clean)) {
                if (clean.length >= 10) {
                    return true;
                }
                if (/^\d{8}$/.test(clean) || /^\d{13}$/.test(clean)) {
                    return true;
                }
            }
            return false;
        }

        function extractBarcodes(text) {
            const barcodes = [];
            const parts = text.split(/[\s\n\r,;|]+/);
            
            for (let part of parts) {
                part = part.trim();
                if (part && isLikelyBarcode(part)) {
                    barcodes.push(part);
                }
            }
            
            if (barcodes.length === 0 && isLikelyBarcode(text)) {
                barcodes.push(text.trim());
            }
            
            return barcodes;
        }

        async function onScanSuccess(decodedText, decodedResult) {
            const now = Date.now();
            
            if (isProcessing || (now - lastScanTime < SCAN_COOLDOWN)) {
                return;
            }
            
            isProcessing = true;
            lastScanTime = now;
            
            const barcodes = extractBarcodes(decodedText);
            
            if (barcodes.length === 0) {
                isProcessing = false;
                return;
            }
            
            // Добавляем новые коды
            let newCodes = 0;
            for (let barcode of barcodes) {
                if (!scannedCodes.includes(barcode)) {
                    scannedCodes.push(barcode);
                    newCodes++;
                }
            }
            
            // Показываем отсканированные коды
            if (scannedCodes.length > 0) {
                document.getElementById('scannedCodes').style.display = 'block';
                const codesList = document.getElementById('codesList');
                codesList.innerHTML = '';
                
                for (let code of scannedCodes) {
                    const codeElement = document.createElement('div');
                    codeElement.className = 'code-item';
                    codeElement.textContent = code;
                    codesList.appendChild(codeElement);
                }
            }
            
            const status = document.getElementById('status');
            
            if (scannedCodes.length >= 2) {
                // Нашли оба кода
                status.innerHTML = `✅ <b>Найдено кодов: ${scannedCodes.length}</b>`;
                status.className = 'status success';
                
                const allCodes = scannedCodes.join('|');
                try {
                    tg.sendData(allCodes);
                    
                    setTimeout(() => {
                        tg.close();
                    }, 200);
                    
                } catch (error) {
                    console.error('Ошибка отправки:', error);
                    status.innerHTML = '❌ Ошибка отправки данных';
                    status.className = 'status';
                    isProcessing = false;
                }
            } else {
                // Нашли только один код
                status.innerHTML = `📸 <b>Найден 1 код.</b> Ищу второй...`;
                status.className = 'status warning';
                
                setTimeout(() => {
                    isProcessing = false;
                }, 100);
            }
        }

        function onScanError(error) {
            // Игнорируем ошибки сканирования
        }

        async function initScanner() {
            try {
                html5QrCode = new Html5Qrcode("reader");
                
                const config = {
                    fps: 30,
                    qrbox: { width: 350, height: 250 },
                    aspectRatio: 1.4,
                    formatsToSupport: [
                        Html5QrcodeSupportedFormats.EAN_13,
                        Html5QrcodeSupportedFormats.EAN_8,
                        Html5QrcodeSupportedFormats.CODE_128,
                        Html5QrcodeSupportedFormats.CODE_39,
                        Html5QrcodeSupportedFormats.QR_CODE,
                        Html5QrcodeSupportedFormats.UPC_A,
                        Html5QrcodeSupportedFormats.UPC_E,
                        Html5QrcodeSupportedFormats.CODABAR,
                        Html5QrcodeSupportedFormats.DATA_MATRIX,
                        Html5QrcodeSupportedFormats.ITF,
                        Html5QrcodeSupportedFormats.AZTEC,
                    ]
                };

                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    onScanSuccess,
                    onScanError
                );

                console.log('✅ Сканер запущен');

            } catch (error) {
                console.error('Ошибка инициализации:', error);
                document.getElementById('status').innerHTML = 
                    '❌ Ошибка: ' + error.message;
            }
        }

        // Остановка сканера при закрытии
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && html5QrCode) {
                try {
                    html5QrCode.stop().then(() => {
                        html5QrCode.clear();
                    });
                } catch (e) {
                    console.error('Error stopping scanner:', e);
                }
            }
        });

        // Запуск при загрузке
        window.addEventListener('load', initScanner);
        
        // Обработка ошибок
        window.addEventListener('error', (e) => {
            console.error('Global error:', e);
        });
    </script>
</body>
</html>
